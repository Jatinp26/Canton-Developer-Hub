name: Deploy Dev Hub
on:
  push:
    branches: [page]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout page branch
        uses: actions/checkout@v4
        with:
          ref: page
          token: ${{ secrets.LLMS_PUSH_TOKEN }}

      - name: Inject Gemini API key
        run: |
          sed -i 's/GEMINI_KEY_PLACEHOLDER/${{ secrets.GEMINI_API_KEY }}/g' index.html

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4